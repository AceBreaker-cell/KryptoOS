[package]
name = "kryptonos-ui"
version = "0.1.0"
edition = "2021"
description = "KryptonOS Unified Application"
license = "MIT OR Apache-2.0"
repository = "https://github.com/albatany/KryptoOS"

[[bin]]
name = "kryptonos"
path = "src/main.rs"

[dependencies]
kryptonos-core = { path = "../kryptonos-core" }
tokio = { version = "1.0", features = ["macros", "rt"] }
slint = { version = "1.0", features = ["fluent"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"